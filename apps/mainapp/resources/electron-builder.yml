appId: 'mainapp'
asar: true
directories:
  buildResources: 'resources'
  output: '.dist/release/${version}'
files:
  - '!**/.vscode/*'
  - '!.dist/release/**'
  - '!.dist/stage/**'
  - '!main/**'
  - '!preload/**'
  - '!renderer/**'
  - '!src/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!resources/electron-builder.yml'
  - '!resources/electron-installer.nsh'
  - '!resources/electron-release.ts'
  - '!resources/electron-update.ts'
  - '!resources/entitlements.mac.plist'
  - '!resources/icon-activity.png'
  - '!resources/icon.icns'
  - '!resources/icon.ico'
  - '!resources/icon.png'
  - '!{.eslintcache,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.*.json}'
asarUnpack:
  - 'resources/**'
  - 'node_modules/**/*.node'
  - 'node_modules/**/*.dll'
  - 'node_modules/**/*.so'
  - 'node_modules/**/*.dylib'
win:
  icon: 'resources/icon.ico'
  target:
    - nsis
nsis:
  artifactName: '${productName}-${version}-windows-${arch}-setup.${ext}'
  guid: 'c58d200b-4af3-51cc-9204-f361c4d09dae'
  include: 'resources/electron-installer.nsh'
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  shortcutName: '${productName}'
  uninstallDisplayName: '${productName}'
  createDesktopShortcut: always
mac:
  icon: 'resources/icon.icns'
  entitlementsInherit: 'resources/entitlements.mac.plist'
  target:
    - dmg
    - zip
  artifactName: '${productName}-${version}-macos-${arch}.${ext}'
linux:
  target:
    - AppImage
  artifactName: '${productName}-${version}-linux-${arch}.${ext}'
publish:
  provider: github
